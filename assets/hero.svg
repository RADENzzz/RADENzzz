<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Alrhaden Javier — Full-Stack &amp; Systems Developer</title>
  <desc id="heroDesc">Dark terminal-style banner with an animated aurora, a radar ring, a glitching name and a live command prompt.</desc>

  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B7CFF" />
      <stop offset="45%" stop-color="#CFC9FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6C63FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="55%" stop-color="#04070C" stop-opacity="0" />
      <stop offset="100%" stop-color="#04070C" stop-opacity="0.85" />
    </radialGradient>

    <filter id="auroraBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="78" />
    </filter>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#1A2438" stroke-width="1" />
    </pattern>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" opacity="0.028" />
    </pattern>

    <style>
      .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Consolas, monospace; }
      .label { font-size: 11px; letter-spacing: 2.4px; font-weight: 500; }
      .name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 60px; font-weight: 800; letter-spacing: 1.5px; }
      .glitchA { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 60px; font-weight: 800; letter-spacing: 1.5px; fill: none; stroke-width: 1.4; }
      .role { font-family: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Consolas, monospace; font-size: 15px; letter-spacing: 5.6px; font-weight: 500; }
      .term { font-family: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Consolas, monospace; font-size: 16px; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1280" height="340" fill="#070B12" />

  <!-- drifting aurora -->
  <g filter="url(#auroraBlur)">
    <ellipse cx="170" cy="40" rx="430" ry="230" fill="#6C63FF" opacity="0.30">
      <animateTransform attributeName="transform" type="translate" values="0 0; 70 26; 0 0" dur="26s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" />
    </ellipse>
    <ellipse cx="1110" cy="300" rx="470" ry="240" fill="#00D2FF" opacity="0.22">
      <animateTransform attributeName="transform" type="translate" values="0 0; -60 -22; 0 0" dur="32s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" />
    </ellipse>
  </g>

  <!-- grid + depth -->
  <rect y="46" width="1280" height="270" fill="url(#grid)" opacity="0.55" />
  <rect width="1280" height="340" fill="url(#vignette)" />
  <rect width="1280" height="340" fill="url(#scan)" />

  <!-- radar rings -->
  <g>
    <circle cx="1148" cy="176" r="94" fill="none" stroke="#00D2FF" stroke-width="1" stroke-dasharray="2 10" opacity="0.45">
      <animateTransform attributeName="transform" type="rotate" from="0 1148 176" to="360 1148 176" dur="34s" repeatCount="indefinite" />
    </circle>
    <circle cx="1148" cy="176" r="66" fill="none" stroke="#6C63FF" stroke-width="1" stroke-dasharray="38 14" opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="360 1148 176" to="0 1148 176" dur="22s" repeatCount="indefinite" />
    </circle>
    <circle cx="1148" cy="176" r="38" fill="none" stroke="#00D2FF" stroke-width="1" opacity="0.16" />
    <g>
      <circle cx="1148" cy="82" r="3" fill="#00D2FF" />
      <circle cx="1148" cy="82" r="7" fill="#00D2FF" opacity="0.16">
        <animate attributeName="r" values="5;12;5" dur="3.4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.28;0;0.28" dur="3.4s" repeatCount="indefinite" />
      </circle>
      <animateTransform attributeName="transform" type="rotate" from="0 1148 176" to="360 1148 176" dur="34s" repeatCount="indefinite" />
    </g>
    <circle cx="1148" cy="176" r="2.5" fill="#E8ECF5" opacity="0.7" />
  </g>

  <!-- scan sweep -->
  <rect x="-60" y="46" width="2" height="270" fill="#00D2FF" opacity="0.18">
    <animate attributeName="x" values="-60;1300" dur="11s" repeatCount="indefinite" />
  </rect>

  <!-- frame ticks -->
  <g fill="none" stroke="#00D2FF" stroke-width="1.5" opacity="0.4" stroke-linecap="square">
    <path d="M22 62V22H62" />
    <path d="M1258 62V22H1218" />
    <path d="M22 278V318H62" />
    <path d="M1258 278V318H1218" />
  </g>

  <!-- top status bar -->
  <line x1="0" y1="46" x2="1280" y2="46" stroke="#16213A" stroke-width="1" />
  <circle cx="68" cy="26" r="4" fill="#3DFFB0">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <circle cx="68" cy="26" r="9" fill="none" stroke="#3DFFB0" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="6;14;6" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;0;0.4" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <text class="mono label" x="86" y="30" fill="#7C8AA0">ONLINE · BUILDING COE-NNECT</text>
  <text class="mono label" x="1216" y="30" fill="#4E5C74" text-anchor="end">PROFILE // 001</text>

  <!-- headline -->
  <text class="name" x="64" y="172" fill="url(#nameGrad)">ALRHADEN JAVIER</text>
  <text class="glitchA" x="64" y="172" stroke="#FF3B6B" opacity="0">
    ALRHADEN JAVIER
    <animate attributeName="opacity" values="0;0;0.75;0.45;0.65;0" keyTimes="0;0.90;0.92;0.94;0.96;1" dur="7s" repeatCount="indefinite" calcMode="discrete" />
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-5 2;4 -2;-2 1;0 0" keyTimes="0;0.90;0.92;0.94;0.96;1" dur="7s" repeatCount="indefinite" calcMode="discrete" />
  </text>
  <text class="glitchA" x="64" y="172" stroke="#00E5FF" opacity="0">
    ALRHADEN JAVIER
    <animate attributeName="opacity" values="0;0;0.6;0.7;0.4;0" keyTimes="0;0.86;0.88;0.90;0.92;1" dur="9s" repeatCount="indefinite" calcMode="discrete" />
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;4 -2;-4 2;2 0;0 0" keyTimes="0;0.86;0.88;0.90;0.92;1" dur="9s" repeatCount="indefinite" calcMode="discrete" />
  </text>

  <!-- role -->
  <text class="role" x="66" y="212" fill="#93A1B5">FULL-STACK &amp; SYSTEMS DEVELOPER</text>

  <!-- accent bar -->
  <rect x="66" y="232" width="132" height="3" rx="1.5" fill="url(#barGrad)">
    <animate attributeName="width" values="0;132;132" keyTimes="0;0.3;1" dur="10s" repeatCount="indefinite" />
  </rect>

  <!-- terminal line -->
  <text class="term" x="66" y="296" fill="#00D2FF">Hi there...</text>
  <rect x="583" y="281" width="9" height="17" fill="#6C63FF">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="1.1s" repeatCount="indefinite" calcMode="discrete" />
  </rect>
</svg>
